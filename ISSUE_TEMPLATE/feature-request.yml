name: Feature request
description: Suggest something this project could do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task or question, and why the current version does not cover it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: other
    attributes:
      label: Anything else
